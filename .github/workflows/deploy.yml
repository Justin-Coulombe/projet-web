
name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build CSS
        run: |
          npm ci
          npm run build:css

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload application
        run: |
          rsync -az --delete \
            --exclude "/.git/" \
            --exclude "/.github/" \
            --exclude "/.venv/" \
            --exclude "/node_modules/" \
            --exclude "/.env" \
            --exclude "/database/" \
            --exclude "/app/static/img/stationnement/" \
            ./ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/parkshare/"

      - name: Configure Nominatim on VPS
        env:
          NOMINATIM_USER_AGENT: ${{ secrets.NOMINATIM_USER_AGENT }}
        run: |
          set -e

          if [ -z "$NOMINATIM_USER_AGENT" ]; then
            echo "ERROR: NOMINATIM_USER_AGENT secret missing"
            exit 1
          fi

          if [[ "$NOMINATIM_USER_AGENT" == *$'\n'* ]] || \
             [[ "$NOMINATIM_USER_AGENT" == *$'\r'* ]]; then
            echo "ERROR: Invalid User-Agent"
            exit 1
          fi

          umask 077
          TEMP_FILE=$(mktemp)
          trap 'rm -f "$TEMP_FILE"' EXIT

          printf '%s' "$NOMINATIM_USER_AGENT" > "$TEMP_FILE"

          scp "$TEMP_FILE" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/parkshare-nominatim-${{ github.run_id }}.tmp"

          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'python3 -' <<'PY'
          from pathlib import Path

          env_path = Path("/var/www/parkshare/.env")
          temp_path = Path("/tmp/parkshare-nominatim-${{ github.run_id }}.tmp")

          try:
              value = temp_path.read_text().strip()

              if not value or "\n" in value or "\r" in value:
                  raise SystemExit("Invalid Nominatim configuration")

              lines = (
                  env_path.read_text().splitlines()
                  if env_path.exists() else []
              )

              lines = [
                  line for line in lines
                  if not line.startswith("NOMINATIM_USER_AGENT=")
              ]

              lines.append("NOMINATIM_USER_AGENT=" + value)
              env_path.write_text("\n".join(lines) + "\n")
              env_path.chmod(0o600)

              print("Nominatim configuration updated")
          finally:
              temp_path.unlink(missing_ok=True)
          PY

      - name: Install dependencies and restart server
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -se' <<'EOF'
          set -e

          cd /var/www/parkshare
          source .venv/bin/activate

          pip install -r requirements.txt

          python - <<'PY'
          from dotenv import load_dotenv
          import os

          load_dotenv("/var/www/parkshare/.env")

          if not os.getenv("NOMINATIM_USER_AGENT"):
              raise SystemExit("NOMINATIM_USER_AGENT missing")

          print("Nominatim configuration OK")
          PY

          mkdir -p database
          mkdir -p app/static/img/stationnement

          sudo systemctl restart parkshare

          sleep 3

          curl --fail --silent --show-error \
            http://127.0.0.1:8000/ > /dev/null

          echo "Deployment successful"
          EOF
