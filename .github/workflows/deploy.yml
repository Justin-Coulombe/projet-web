name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build CSS
        run: |
          npm ci
          npm run build:css

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload application
        run: |
          rsync -az --delete \
            --exclude "/.git/" \
            --exclude "/.github/" \
            --exclude "/.venv/" \
            --exclude "/node_modules/" \
            --exclude "/.env" \
            --exclude "/database/" \
            --exclude "/app/static/images/stationnement/" \
            ./ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/parkshare/


      - name: Configure Nominatim on VPS
        env:
          NOMINATIM_USER_AGENT: ${{ secrets.NOMINATIM_USER_AGENT }}
        run: |
          if [ -z "$NOMINATIM_USER_AGENT" ]; then
            echo "ERROR: NOMINATIM_USER_AGENT secret missing"
            exit 1
          fi

          printf '%s' "$NOMINATIM_USER_AGENT" | \
            ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'python3 -c '"'"'
            import sys
            from pathlib import Path

            path = Path("/var/www/parkshare/.env")
            value = sys.stdin.read()

            if not value or "\n" in value or "\r" in value:
                raise SystemExit("Invalid Nominatim User-Agent")

            lines = path.read_text().splitlines() if path.exists() else []
            lines = [
                line for line in lines
                if not line.startswith("NOMINATIM_USER_AGENT=")
            ]
            lines.append("NOMINATIM_USER_AGENT=" + value)

            path.write_text("\n".join(lines) + "\n")
            path.chmod(0o600)

            print("Nominatim configuration updated")
            '"'"''


      - name: Install dependencies and restart server
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e

            cd /var/www/parkshare

            source .venv/bin/activate

            python - <<'PY'
            from dotenv import load_dotenv
            import os

            load_dotenv("/var/www/parkshare/.env")

            if not os.getenv("NOMINATIM_USER_AGENT"):
                raise SystemExit("NOMINATIM_USER_AGENT missing")

            print("Nominatim configuration OK")
            PY

            pip install -r requirements.txt

            mkdir -p database
            mkdir -p app/static/images/stationnement

            sudo systemctl restart parkshare

            sleep 3

            curl --fail http://127.0.0.1:8000/ > /dev/null

            echo "Deployment successful"
          EOF